<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - JNC_Kalasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container-fluid">
    
    <a class="navbar-brand navbar-brand-school" href="/" title="JNC_Kalasi">
      <span class="brand-main">JNC<span>_Kalasi</span></span>
      
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        
        <li class="nav-item">
          <a class="nav-link" href="/login">Connexion</a>
        </li>
        
      </ul>
    </div>
  </div>
</nav>
<div class="dashboard-container">
  
  
  

  
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>JNC_Kalasi</h1>
      <p class="tagline">Plateforme de Gestion Scolaire Moderne</p>
      
    </div>
    <div class="login-body">
      <form method="post">
        <div class="mb-3">
          <label class="form-label" for="username">Nom d'utilisateur</label>
          <input id="username" type="text" name="username" class="form-control" placeholder="Entrez votre nom d'utilisateur" title="Nom d'utilisateur" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Mot de passe</label>
          <input id="password" type="password" name="password" class="form-control" placeholder="Entrez votre mot de passe" title="Mot de passe" required>
        </div>
        <button type="submit" class="btn-login">Se connecter</button>
      </form>
    </div>
  </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
