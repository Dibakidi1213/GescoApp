services:
  - type: web
    name: gescoapp
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gescoapp-db
          property: connectionString
      - key: ALLOW_RESTORE_DOWNLOAD
        value: "false"

databases:
  - name: gescoapp-db
    plan: free
