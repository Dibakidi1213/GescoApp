{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

<div class="container py-4">
    <h2>Tableau de Bord - Secrétariat</h2>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="stat-label">Bulletins Générés</div>
                <div class="stat-value" id="bulletins-gen">-</div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">Progression de Saisie par Classe (1èP)</div>
                <div class="chart-container">
                    <canvas id="submissionChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">Moyennes Comparatives par Classe</div>
                <div class="chart-container">
                    <canvas id="classAvgChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/chart_configs.js') }}"></script>
<script>
    let charts = {};
    async function updateDashboard() {
        const stats = await fetch("{{ url_for('secretaire.get_dashboard_stats') }}").then(r => r.json());

        document.getElementById('bulletins-gen').innerText = `${stats.bulletin_stats.generated} / ${stats.bulletin_stats.total}`;

        const ctxSub = document.getElementById('submissionChart').getContext('2d');
        if(charts.sub) charts.sub.destroy();
        charts.sub = DashboardManager.createBarChart(ctxSub, stats.submission_by_class.labels, stats.submission_by_class.data, 'Notes Saisies');

        const ctxAvg = document.getElementById('classAvgChart').getContext('2d');
        if(charts.avg) charts.avg.destroy();
        charts.avg = DashboardManager.createBarChart(ctxAvg, stats.class_averages.labels, stats.class_averages.data, 'Moyenne / 20', DashboardManager.colors.success);
    }
    document.addEventListener('DOMContentLoaded', updateDashboard);
</script>
{% endblock %}
