<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - JNC_KALASI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
        .btn-primary { background-color: #2c3e50; border: none; padding: 10px; }
        .btn-primary:hover { background-color: #1a252f; }
        .logo { text-align: center; margin-bottom: 1.5rem; font-weight: bold; color: #2c3e50; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">JNC_KALASI</div>
        <h4 class="text-center mb-4">Connexion</h4>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Utilisateur ou Email</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div id="2fa-section" class="mb-3 d-none">
                <label class="form-label">Code 2FA (TOTP)</label>
                <input type="text" class="form-control" id="otp_token">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </div>
            <div class="text-center mt-3">
                <a href="/auth/reset-password" class="text-muted small">Mot de passe oublié ?</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                otp_token: document.getElementById('otp_token').value
            };

            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (response.status === 206 && result.2fa_required) {
                document.getElementById('2fa-section').classList.remove('d-none');
                alert("Veuillez saisir votre code 2FA");
            } else if (response.ok) {
                localStorage.setItem('access_token', result.access_token);
                window.location.href = '/dashboard';
            } else {
                alert(result.message || "Erreur de connexion");
            }
        });
    </script>
</body>
</html>
