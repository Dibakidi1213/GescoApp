<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation - JNC_KALASI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reset-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
        .btn-primary { background-color: #2c3e50; border: none; padding: 10px; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h4 class="text-center mb-4">Réinitialisation</h4>
        <p class="text-muted small text-center">Entrez votre email pour recevoir un lien de réinitialisation.</p>
        <form id="resetForm">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Envoyer le lien</button>
            </div>
            <div class="text-center mt-3">
                <a href="/auth/login" class="text-muted small">Retour à la connexion</a>
            </div>
        </form>
    </div>
</body>
</html>
